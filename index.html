function h(tag, props) {
  const el = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.slice(0, 2) === "on" && typeof v === "function") el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v !== null && v !== undefined && v !== false) el.setAttribute(k, v);
  }
  for (let i = 2; i < arguments.length; i++) add(el, arguments[i]);
  return el;
}
function add(el, c) {
  if (c === null || c === undefined || c === false) return;
  if (Array.isArray(c)) return c.forEach((x) => add(el, x));
  el.appendChild(typeof c === "object" ? c : document.createTextNode(String(c)));

/* Substitutes: other library moves sharing a purpose tag, ranked by overlap. */
function substitutesFor(name, useFilter) {
  const cur = EX_BY_NAME[name];
  const tags = useFilter ? [useFilter] : (cur ? cur.u : []);
  return EXERCISES
    .filter((x) => x.n !== name && x.u.some((t) => tags.includes(t)))
    .map((x) => ({ x, score: x.u.filter((t) => tags.includes(t)).length }))
    .sort((a, b) => b.score - a.score)
    .map((o) => o.x);
}

const KEY = "golffit.v1";
function blankDB() {
  return { meta: { version: 1, createdAt: todayISO(), updatedAt: todayISO() },
    settings: { units: "lb" }, sessions: [], activeSession: null, screens: [], angles: [], customDays: {} };
}
function loadDB() {
  try { const raw = localStorage.getItem(KEY); if (raw) return migrate(JSON.parse(raw)); } catch (e) {}
  return blankDB();
}
function migrate(db) {
  db.meta = db.meta || { version: 1 }; db.settings = db.settings || { units: "lb" };
  db.sessions = db.sessions || []; db.screens = db.screens || []; db.angles = db.angles || [];
  db.customDays = db.customDays || {};
  if (!("activeSession" in db)) db.activeSession = null;
  return db;
}
const clone = (o) => JSON.parse(JSON.stringify(o));
/* Effective day = user's custom-edited copy if present, else the built-in default. */
function getDay(id) {
  const base = DAY_BY_ID[id]; if (!base) return null;
  const custom = DB.customDays[id];
  return custom ? Object.assign({}, base, { blocks: custom.blocks, edited: true }) : base;
}
function customBlocks(id) {
  if (!DB.customDays[id]) DB.customDays[id] = { blocks: clone(DAY_BY_ID[id].blocks) };
  return DB.customDays[id].blocks;
}
function resetDay(id) { delete DB.customDays[id]; save(true); }
let DB = loadDB();
let saveTimer = null;
function save(now) {
  DB.meta.updatedAt = todayISO();
  if (now) { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} return; }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} }, 250);
}

/* --------------------------- session helpers ------------------------------ */
const blankSet = () => ({ done: false, weight: "", reps: "" });
function newActive(dayId) {
  const day = getDay(dayId);
  const log = {};
  day.blocks.forEach((b) => {
    log[b.id] = b.exercises.map((e) => Array.from({ length: e.sets || 0 }, blankSet));
  });
  return { id: uid(), dayId, date: todayISO(), accumSec: 0, running: false, lastResume: null, log, variant: {} };
}
/* Reconcile an active session's log to the day's current structure,
   preserving already-logged sets by position (needed after in-app edits). */
function reconcileLog(day, active) {
  const next = {};
  day.blocks.forEach((b) => {
    const prevBlock = active.log[b.id] || [];
    next[b.id] = b.exercises.map((e, ei) => {
      const prevRows = prevBlock[ei] || [];
      return Array.from({ length: e.sets || 0 }, (_, si) => prevRows[si] || blankSet());
    });
  });
  active.log = next;
}
function ensureActive(dayId) {
  if (!DB.activeSession || DB.activeSession.dayId !== dayId || dayKey(DB.activeSession.date) !== dayKey()) {
    DB.activeSession = newActive(dayId);
    save();
  } else {
    reconcileLog(getDay(dayId), DB.activeSession);
  }
  if (!DB.activeSession.variant) DB.activeSession.variant = {};
  return DB.activeSession;
}
function sessionElapsed(s) { return s.accumSec + (s.running && s.lastResume ? (Date.now() - s.lastResume) / 1000 : 0); }
function finishSession() {
  const a = DB.activeSession; if (!a) return;
  const day = getDay(a.dayId);
  const rec = { id: a.id, dayId: a.dayId, dayLabel: day.title, date: a.date,
    durationSec: Math.round(sessionElapsed(a)),
    blocks: day.blocks.map((b) => ({ blockId: b.id, label: b.label,
      exercises: b.exercises.map((e, ei) => ({ name: e.name, scheme: e.scheme,
        variant: (a.variant && a.variant[b.id + ":" + ei]) || null,
        sets: (a.log[b.id] && a.log[b.id][ei]) ? a.log[b.id][ei].map((s) => ({ done: !!s.done, weight: numOrNull(s.weight), reps: numOrNull(s.reps) })) : [] })) })) };
  DB.sessions.unshift(rec);
  DB.sessions = DB.sessions.slice(0, 400);
  DB.activeSession = null;
  save(true);
}
const numOrNull = (v) => { const n = parseFloat(v); return isFinite(n) ? n : null; };

/* ------------------------------ DAY view ---------------------------------- */
let openBlock = null;
let editMode = false;
let openHow = new Set(); // exercise keys with How-to expanded
function viewDay(wrap, dayId) {
  const day = getDay(dayId);
  if (!day) return go("week");
  const active = ensureActive(dayId);
  if (openBlock === null) openBlock = day.blocks[0].id;

  // header row: back + edit toggle
  wrap.appendChild(h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", paddingBottom: "12px" } },
    h("button", { class: "btn", onclick: () => { openBlock = null; editMode = false; go("week"); },
      style: { background: "none", color: "var(--sub)", padding: 0, fontWeight: 600, fontSize: "14px" } }, "‹ Week"),
    h("button", { class: "btn", onclick: () => { editMode = !editMode; openBlock = editMode ? "__all__" : null; render(); },
      style: { background: editMode ? day.accent : "transparent", color: editMode ? "var(--ink)" : "var(--sub)",
        border: editMode ? "none" : "1px solid #333", padding: "7px 14px", fontSize: "13px" } },
      editMode ? "Done" : "✎ Edit")));
  wrap.appendChild(h("div", { style: { marginBottom: "18px" } },
    h("div", { class: "kicker", style: { color: day.accent } }, day.kicker + (day.edited ? " · edited" : "")),
    h("h1", { class: "title" }, day.title),
    h("p", { class: "subtitle" }, day.subtitle)));

  if (editMode) {
    wrap.appendChild(h("div", { class: "card", style: { padding: "13px 16px", marginBottom: "16px", borderColor: day.accent } },
      h("div", { style: { fontSize: "13px", color: "#cfd3d9", lineHeight: 1.5 } },
        "Editing this day. Tap Swap to trade a movement for one with the same purpose, adjust sets, or add/remove exercises. Saved on this device."),
      (day.edited ? h("button", { class: "btn", onclick: () => {
          if (!confirm("Reset " + day.title + " to its original exercises?")) return;
          resetDay(dayId); ensureActive(dayId); toast("Reset to default"); render();
        }, style: { marginTop: "10px", padding: "8px 14px", background: "transparent", color: "#c88", border: "1px solid #5a3a3a", fontSize: "13px" } }, "↺ Reset day to default") : null)));
  }

  // session timer (hidden while editing)
  if (!editMode) {
    const timerVal = h("div", { class: "tabnum", style: { fontSize: "32px", fontWeight: 800, letterSpacing: "-.02em" } }, fmt(sessionElapsed(active)));
    const startBtn = h("button", { class: "btn" });
    function paintSession() {
      startBtn.textContent = active.running ? "Pause" : (active.accumSec > 0 ? "Resume" : "Start session");
      Object.assign(startBtn.style, { padding: "11px 24px", fontSize: "15px",
        background: active.running ? "#2a2a2a" : day.accent, color: active.running ? "#eee" : "var(--ink)" });
    }
    startBtn.addEventListener("click", () => {
      if (active.running) { active.accumSec = sessionElapsed(active); active.running = false; active.lastResume = null; }
      else { active.running = true; active.lastResume = Date.now(); }
      save(); paintSession();
    });
    paintSession();
    wrap.appendChild(h("div", { class: "card", style: { display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 20px", marginBottom: "18px" } },
      h("div", {}, h("div", { style: { fontSize: "11px", color: "#777", textTransform: "uppercase", letterSpacing: ".1em" } }, "Total session"), timerVal),
      startBtn));
    liveTimers.push(setInterval(() => { if (active.running) timerVal.textContent = fmt(sessionElapsed(active)); }, 1000));
  }

  if (day.hasScreen && !editMode) wrap.appendChild(screenSummaryCard());

  // blocks
  day.blocks.forEach((b) => wrap.appendChild(blockCard(day, active, b)));

  // finish (hidden while editing)
  if (!editMode) {
    const totalSets = day.blocks.reduce((n, b) => n + b.exercises.reduce((m, e) => m + (e.sets || 0), 0), 0);
    const doneSets = day.blocks.reduce((n, b) => n + (active.log[b.id] || []).reduce((m, rows) => m + rows.filter((s) => s.done).length, 0), 0);
    wrap.appendChild(h("button", { class: "btn", onclick: () => {
        finishSession(); openBlock = null;
        toast("Session logged ✓"); go("progress");
      },
      style: { width: "100%", marginTop: "10px", padding: "15px", fontSize: "15px", background: day.accent, color: "var(--ink)" } },
      "Finish & log session · " + doneSets + "/" + totalSets + " sets"));
    wrap.appendChild(h("p", { style: { fontSize: "12px", color: "var(--dim)", textAlign: "center", marginTop: "16px", lineHeight: 1.6 } }, day.footer));
  }
}

function blockCard(day, active, b) {
  const expanded = editMode || openBlock === b.id;
  const rows = active.log[b.id] || [];
  const totalSets = b.exercises.reduce((n, e) => n + (e.sets || 0), 0);
  const doneSets = rows.reduce((m, r) => m + r.filter((s) => s.done).length, 0);

  const card = h("div", { class: "card", style: { borderColor: expanded ? b.color : "var(--line)", padding: expanded ? "18px 20px" : "15px 20px", marginBottom: "12px" } });
  const head = h("div", { onclick: () => { if (editMode) return; openBlock = expanded ? null : b.id; render(); },
    style: { display: "flex", alignItems: "center", justifyContent: "space-between", cursor: editMode ? "default" : "pointer" } },
    h("div", {},
      h("div", { style: { display: "flex", alignItems: "center", gap: "10px" } }, dot(b.color),
        h("span", { style: { fontSize: "16px", fontWeight: 700, letterSpacing: "-.01em" } }, b.label)),
      h("span", { style: { fontSize: "11.5px", color: "var(--sub)", marginLeft: "18px", textTransform: "uppercase", letterSpacing: ".07em" } }, b.tag + " · target " + fmt(b.dur))),
    totalSets > 0 ? h("span", { class: "tabnum", style: { fontSize: "13px", fontWeight: 700, color: doneSets === totalSets && totalSets > 0 ? b.color : "#666" } }, doneSets + "/" + totalSets) : null);
  card.appendChild(head);

  if (expanded) {
    const body = h("div", { style: { marginTop: "16px" } });
    if (b.note) body.appendChild(h("p", { style: { fontSize: "13px", color: "#9a9a9a", margin: "0 0 14px", lineHeight: 1.5 } }, b.note));
    b.exercises.forEach((e, ei) => {
      const exWrap = h("div", { style: { padding: "12px 0", borderTop: ei ? "1px solid var(--line2)" : "none" } },
        h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: "10px" } },
          h("span", { style: { fontSize: "15px", fontWeight: 600 } }, e.name),
          h("span", { class: "tabnum", style: { fontSize: "13px", color: b.color, flex: "0 0 auto" } }, e.scheme)));
      if (!editMode && hasHow(e.name)) exWrap.appendChild(howToBlock(b.id, ei, e.name));
      if (editMode) exWrap.appendChild(exerciseEditRow(day.id, b.id, ei, e));
      else if (e.sets) {
        const vlist = variantsOf(e.name);
        if (vlist.length) exWrap.appendChild(variantChips(active, b.id, ei, vlist));
        exWrap.appendChild(setGrid(active, b, ei, e));
      }
      body.appendChild(exWrap);
    });
    if (editMode) {
      body.appendChild(h("button", { class: "btn", onclick: () => openAdd(day.id, b.id),
        style: { marginTop: "14px", width: "100%", padding: "11px", background: "transparent", border: "1px dashed #3a3a3a", color: "#bbb", fontSize: "13.5px" } },
        "+ Add exercise from library"));
    } else {
      body.appendChild(blockTimer(b));
    }
    card.appendChild(body);
  }
  return card;
}

/* Purpose chips + Swap / sets / remove controls shown per exercise in edit mode. */
function exerciseEditRow(dayId, bid, ei, e) {
  const lib = EX_BY_NAME[e.name];
  const purpose = lib ? lib.u.slice(0, 3).map((t) => USE[t]).join(" · ") : "custom";
  const row = h("div", { style: { marginTop: "8px" } });
  row.appendChild(h("div", { style: { fontSize: "11px", color: "var(--dim)", marginBottom: "8px" } }, "Purpose: " + purpose));
  const controls = h("div", { style: { display: "flex", gap: "8px", alignItems: "center", flexWrap: "wrap" } });
  controls.appendChild(h("button", { class: "btn", onclick: () => openSwap(dayId, bid, ei),
    style: { padding: "8px 14px", background: "#1a2530", color: "#cfe0f0", border: "1px solid var(--blue)", fontSize: "13px" } }, "⇄ Swap"));
  // sets stepper
  const stepWrap = h("div", { style: { display: "flex", alignItems: "center", gap: "6px", border: "1px solid #333", borderRadius: "9px", padding: "4px 6px" } },
    h("button", { class: "btn", onclick: () => setsAdjust(dayId, bid, ei, -1), style: setStepStyle() }, "−"),
    h("span", { class: "tabnum", style: { fontSize: "13px", minWidth: "46px", textAlign: "center", color: "#ccc" } }, (e.sets || 0) + " sets"),
    h("button", { class: "btn", onclick: () => setsAdjust(dayId, bid, ei, 1), style: setStepStyle() }, "+"));
  controls.appendChild(stepWrap);
  controls.appendChild(h("button", { class: "btn", onclick: () => removeExercise(dayId, bid, ei),
    style: { padding: "8px 14px", background: "transparent", color: "#c88", border: "1px solid #5a3a3a", fontSize: "13px", marginLeft: "auto" } }, "Remove"));
  row.appendChild(controls);
  return row;
}
function setStepStyle() { return { width: "30px", height: "30px", padding: 0, background: "#242424", color: "#eee", fontSize: "18px", lineHeight: 1 }; }

/* ---- edit operations (mutate the day's custom copy, then reconcile) ---- */
function blockIn(dayId, bid) { const blocks = customBlocks(dayId); return blocks.find((b) => b.id === bid); }
function afterEdit(dayId) { save(true); if (DB.activeSession && DB.activeSession.dayId === dayId) reconcileLog(getDay(dayId), DB.activeSession); render(); }
function setsAdjust(dayId, bid, ei, delta) {
  const blk = blockIn(dayId, bid); const e = blk.exercises[ei];
  e.sets = Math.max(0, Math.min(8, (e.sets || 0) + delta));
  afterEdit(dayId);
}
function removeExercise(dayId, bid, ei) {
  const blk = blockIn(dayId, bid);
  if (blk.exercises.length <= 1) { toast("Keep at least one exercise"); return; }
  blk.exercises.splice(ei, 1); afterEdit(dayId);
}

/* ---- library picker (bottom sheet) for swap / add ---- */
let libPicker = null; // { mode:'swap'|'add', dayId, bid, ei, useFilter, query }
function openSwap(dayId, bid, ei) {
  const cur = EX_BY_NAME[blockIn(dayId, bid).exercises[ei].name];
  libPicker = { mode: "swap", dayId, bid, ei, useFilter: cur ? cur.u[0] : null, query: "" };
  render();
}
function openAdd(dayId, bid) { libPicker = { mode: "add", dayId, bid, useFilter: null, query: "" }; render(); }
function closePicker() { libPicker = null; render(); }
function applyPick(exName) {
  const P = libPicker; const blk = blockIn(P.dayId, P.bid);
  if (P.mode === "swap") { blk.exercises[P.ei].name = exName; }
  else { const anySets = blk.exercises.some((x) => x.sets); blk.exercises.push({ name: exName, scheme: anySets ? "8 reps" : "—", sets: anySets ? 3 : 0 }); }
  libPicker = null; save(true);
  if (DB.activeSession && DB.activeSession.dayId === P.dayId) reconcileLog(getDay(P.dayId), DB.activeSession);
  toast(P.mode === "swap" ? "Swapped ✓" : "Added ✓"); render();
}
function libraryOverlay() {
  const P = libPicker;
  const curName = P.mode === "swap" ? blockIn(P.dayId, P.bid).exercises[P.ei].name : null;
  const overlay = h("div", { class: "overlay", onclick: (e) => { if (e.target === overlay) closePicker(); } });
  const sheet = h("div", { class: "sheet" });
  overlay.appendChild(sheet);
  sheet.appendChild(h("div", { style: { padding: "16px 18px 10px", display: "flex", justifyContent: "space-between", alignItems: "center" } },
    h("div", {}, h("div", { style: { fontSize: "16px", fontWeight: 800 } }, P.mode === "swap" ? "Swap movement" : "Add exercise"),
      curName ? h("div", { style: { fontSize: "12px", color: "var(--sub)", marginTop: "2px" } }, "Replacing: " + curName) : null),
    h("button", { class: "btn", onclick: closePicker, style: { background: "none", color: "#999", fontSize: "24px", padding: "0 4px", lineHeight: 1 } }, "×")));
  const search = h("input", { type: "text", placeholder: "Search movements…", value: P.query,
    style: { margin: "0 18px 12px", padding: "10px 12px", borderRadius: "9px", border: "1px solid #333", background: "var(--bg)", color: "#f0f0f0", fontSize: "14px" } });
  sheet.appendChild(search);
  const useTags = Object.keys(USE).filter((k) => EXERCISES.some((x) => x.u.includes(k)));
  const ordered = curName && EX_BY_NAME[curName]
    ? EX_BY_NAME[curName].u.concat(useTags.filter((t) => !EX_BY_NAME[curName].u.includes(t))) : useTags;
  const chipRow = h("div", { style: { display: "flex", gap: "7px", overflowX: "auto", padding: "0 18px 12px" } });
  sheet.appendChild(chipRow);
  const listWrap = h("div", { style: { overflowY: "auto", padding: "0 12px 18px", flex: "1" } });
  sheet.appendChild(listWrap);

  function computeItems() {
    const q = P.query.trim().toLowerCase();
    let items;
    if (q) items = EXERCISES.filter((x) => x.n.toLowerCase().includes(q));
    else if (P.useFilter) items = EXERCISES.filter((x) => x.u.includes(P.useFilter));
    else if (P.mode === "swap") items = substitutesFor(curName, null);
    else items = EXERCISES.slice();
    if (P.mode === "swap") items = items.filter((x) => x.n !== curName);
    return items;
  }
  function paintChips() {
    clear(chipRow);
    const mk = (label, val) => h("button", { class: "chip" + (P.useFilter === val && !P.query ? " on" : ""),
      onclick: () => { P.useFilter = val; P.query = ""; search.value = ""; refresh(); } }, label);
    chipRow.appendChild(mk(P.mode === "swap" ? "All substitutes" : "All exercises", null));
    ordered.forEach((t) => chipRow.appendChild(mk(USE[t], t)));
  }
  function paintList() {
    clear(listWrap);
    const items = computeItems();
    if (!items.length) { listWrap.appendChild(h("div", { style: { padding: "24px", textAlign: "center", color: "#888", fontSize: "14px" } }, "No matches.")); return; }
    items.forEach((x) => {
      const equip = x.e.map((k) => EQUIP[k]).join(", ");
      const purpose = x.u.map((t) => USE[t]).slice(0, 2).join(" · ");
      listWrap.appendChild(h("div", { class: "card", onclick: () => applyPick(x.n),
        style: { padding: "12px 14px", marginBottom: "8px", cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center", gap: "10px" } },
        h("div", {}, h("div", { style: { fontSize: "14.5px", fontWeight: 600 } }, x.n),
          h("div", { style: { fontSize: "11.5px", color: "var(--sub)", marginTop: "2px" } }, purpose + " · " + equip + (x.c ? " · ⚠ hamstring" : ""))),
        h("span", { style: { color: "var(--blue)", fontSize: "22px", flex: "0 0 auto" } }, "＋")));
    });
  }
  function refresh() { paintChips(); paintList(); }
  search.addEventListener("input", () => { P.query = search.value; refresh(); });
  refresh();
  return overlay;
}

/* Tap-to-expand How-to cue for a movement. */

    style: { background: "none", border: "none", color: "var(--blue)", fontSize: "12px", fontWeight: 600, padding: "2px 0", cursor: "pointer" } },
    (open ? "▾ " : "▸ ") + "How-to"));
  if (open) box.appendChild(h("p", { style: { fontSize: "12.5px", color: "#b7bcc4", lineHeight: 1.55, margin: "6px 0 2px", padding: "9px 11px", background: "var(--bg)", borderRadius: "9px" } }, HOWTO[name]));
  return box;
}

/* Variant picker shown above the set grid for multi-option exercises. */
function variantChips(active, bid, ei, vlist) {
  const key = bid + ":" + ei;
  const wrap = h("div", { style: { display: "flex", gap: "6px", flexWrap: "wrap", margin: "10px 0 2px", alignItems: "center" } },
    h("span", { style: { fontSize: "11px", color: "var(--dim)", marginRight: "2px" } }, "Did:"));
  vlist.forEach((v) => {
    const on = active.variant[key] === v.name;
    wrap.appendChild(h("button", { class: "chip" + (on ? " on" : ""), style: { padding: "5px 11px", fontSize: "11.5px" },
      onclick: () => {

        save(); render();

  return wrap;
}

function setGrid(active, b, ei, e) {
  const rows = active.log[b.id][ei];
  const grid = h("div", { style: { marginTop: "10px" } });
  rows.forEach((s, si) => {
    const numBtn = h("button", { class: "btn tabnum",
      style: setNumStyle(s.done, b.color),
      onclick: () => { s.done = !s.done; save(); numBtn.setAttribute("style", ""); Object.assign(numBtn.style, setNumStyle(s.done, b.color)); refreshHeadCounts(); } });
    numBtn.textContent = si + 1;
    const weight = h("input", { type: "number", inputmode: "decimal", placeholder: "wt",
      value: s.weight, style: inputStyle(), oninput: (ev) => { s.weight = ev.target.value; save(); } });
    const reps = h("input", { type: "number", inputmode: "numeric", placeholder: "reps",
      value: s.reps, style: inputStyle(), oninput: (ev) => { s.reps = ev.target.value; save(); } });
    grid.appendChild(h("div", { style: { display: "flex", alignItems: "center", gap: "8px", marginBottom: "7px" } },
      numBtn,
      weight, h("span", { style: { color: "var(--dim)", fontSize: "12px" } }, DB.settings.units),
      reps, h("span", { style: { color: "var(--dim)", fontSize: "12px" } }, "reps")));
  });
  function refreshHeadCounts() {
    // update the block header counter live

  }

}

    border: done ? "1px solid " + color : "1px solid #3a3a3a",

function inputStyle() {

function blockTimer(b) {
  let running = false, elapsed = 0, resumeAt = null, intv = null;
  const val = h("span", { class: "tabnum", style: { fontSize: "30px", fontWeight: 700, letterSpacing: "-.02em" } });
  const sub = h("span", { style: { fontSize: "13px", color: "var(--dim)", fontWeight: 500, marginLeft: "8px" } }, "/ " + fmt(b.dur));
  const startBtn = h("button", { class: "btn" });
  function paint() {
    const e = elapsed + (running && resumeAt ? (Date.now() - resumeAt) / 1000 : 0);
    val.textContent = fmt(e); val.style.color = e > b.dur ? b.color : "#f0f0f0";
    startBtn.textContent = running ? "Pause" : (elapsed ? "Resume" : "Start");
    Object.assign(startBtn.style, { padding: "9px 20px", fontSize: "14px", background: running ? "#2a2a2a" : b.color, color: running ? "#eee" : "var(--ink)" });
  }
  startBtn.addEventListener("click", () => {
    if (running) { elapsed += (Date.now() - resumeAt) / 1000; running = false; resumeAt = null; clearInterval(intv); }
    else { running = true; resumeAt = Date.now(); intv = setInterval(paint, 500); liveTimers.push(intv); }
    paint();
  });
  const resetBtn = h("button", { class: "btn", onclick: () => { elapsed = 0; running = false; resumeAt = null; clearInterval(intv); paint(); },
    style: { padding: "9px 16px", border: "1px solid #333", background: "transparent", color: "#888", fontSize: "14px", fontWeight: 600 } }, "Reset");
  paint();
  return h("div", { style: { display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: "16px", padding: "13px 16px", background: "var(--bg)", borderRadius: "10px" } },
    h("span", {}, val, sub),
    h("div", { style: { display: "flex", gap: "8px" } }, startBtn, resetBtn));
}

          h("div", { style: { fontSize: "13px", fontWeight: 700 } }, new Date(en.date).toLocaleDateString()),
          h("div", { style: { fontSize: "11px", color: "var(--sub)" } }, en.dayLabel || "")),
        rows.length ? rows : h("div", { style: { fontSize: "13px", color: "var(--sub)" } }, "No sets recorded."),
        isFinite(best) ? h("div", { style: { fontSize: "11px", color: "var(--orange)", marginTop: "6px", fontWeight: 700 } }, "Top set " + best + u) : null));
    });
  }

  input.addEventListener("input", () => renderList(input.value));
  paint();
  return section;
}

/* Inline SVG line chart. series: [{pts:[{x:iso,y}], color, label}] */
function lineChartCard(title, series, unit) {
  const all = series.flatMap((s) => s.pts);
  const card = h("div", { class: "card", style: { padding: "14px 16px", marginBottom: "10px" } });
  const legend = series.filter((s) => s.label).map((s) => h("span", { style: { fontSize: "11px", color: s.color, fontWeight: 700, marginLeft: "8px" } }, "● " + s.label));
  card.appendChild(h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "8px" } },
    h("span", { style: { fontSize: "13.5px", fontWeight: 600 } }, title),
    h("span", {}, legend)));

  const W = 300, H = 90, padL = 6, padR = 6, padT = 8, padB = 14;
  const ys = all.map((d) => d.y); let minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
  if (minY === maxY) { minY -= 1; maxY += 1; }
  const allX = all.map((d) => new Date(d.x).getTime()); let minX = Math.min.apply(null, allX), maxX = Math.max.apply(null, allX);
  if (minX === maxX) { minX -= 86400000; maxX += 86400000; }
  const sx = (t) => padL + (maxX - minX ? (t - minX) / (maxX - minX) : 0.5) * (W - padL - padR);
  const sy = (v) => padT + (1 - (v - minY) / (maxY - minY)) * (H - padT - padB);

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H); svg.setAttribute("width", "100%"); svg.setAttribute("style", "display:block");
  // baseline
  const base = document.createElementNS(NS, "line"); base.setAttribute("x1", padL); base.setAttribute("x2", W - padR); base.setAttribute("y1", H - padB); base.setAttribute("y2", H - padB); base.setAttribute("stroke", "#262626"); base.setAttribute("stroke-width", "1"); svg.appendChild(base);
  const resolve = (c) => c.indexOf("var(") === 0 ? getComputedStyle(document.documentElement).getPropertyValue(c.slice(4, -1)).trim() : c;
  series.forEach((s, si) => {
    if (!s.pts.length) return;
    const col = resolve(s.color);
    if (s.pts.length > 1) {
      const d = s.pts.map((p, i) => (i ? "L" : "M") + sx(new Date(p.x).getTime()).toFixed(1) + " " + sy(p.y).toFixed(1)).join(" ");
      const path = document.createElementNS(NS, "path"); path.setAttribute("d", d); path.setAttribute("fill", "none"); path.setAttribute("stroke", col); path.setAttribute("stroke-width", "2"); path.setAttribute("stroke-dasharray", si === 1 ? "4 3" : "0"); path.setAttribute("stroke-linejoin", "round"); path.setAttribute("stroke-linecap", "round"); svg.appendChild(path);
    }
    s.pts.forEach((p) => { const c = document.createElementNS(NS, "circle"); c.setAttribute("cx", sx(new Date(p.x).getTime())); c.setAttribute("cy", sy(p.y)); c.setAttribute("r", "2.6"); c.setAttribute("fill", col); svg.appendChild(c); });
    // last value label
    const lastP = s.pts[s.pts.length - 1];
    const lyRaw = sy(lastP.y); const ly = lyRaw - 4 < 10 ? lyRaw + 12 : lyRaw - 4;
    const tx = document.createElementNS(NS, "text"); tx.setAttribute("x", Math.min(sx(new Date(lastP.x).getTime()) + 4, W - 22)); tx.setAttribute("y", ly); tx.setAttribute("fill", col); tx.setAttribute("font-size", "9"); tx.setAttribute("font-weight", "700"); tx.textContent = lastP.y + (unit || ""); svg.appendChild(tx);
  });
  card.appendChild(svg);
  // range footer
  card.appendChild(h("div", { style: { display: "flex", justifyContent: "space-between", fontSize: "10px", color: "var(--dim)", marginTop: "2px" } },
    h("span", {}, shortDate(new Date(minX).toISOString())), h("span", {}, shortDate(new Date(maxX).toISOString()))));
  return card;
}

/* ------------------------------ DATA view --------------------------------- */
function viewData(wrap) {
  wrap.appendChild(h("div", { style: { marginBottom: "18px" } },
    h("div", { class: "kicker", style: { color: "var(--gold)" } }, "Backup & restore"),
    h("h1", { class: "title" }, "Your Data"),
    h("p", { class: "subtitle" }, "Everything is stored on this device. Back it up to a file you keep; restore it on any device.")));

  const stat = h("div", { class: "card", style: { padding: "16px 18px", marginBottom: "16px", fontSize: "13px", color: "#ccc", lineHeight: 1.7 } },
    h("div", {}, DB.sessions.length + " sessions · " + DB.screens.length + " screens · " + DB.angles.length + " angle logs"),
    h("div", { style: { color: "var(--sub)" } }, "Last saved " + new Date(DB.meta.updatedAt).toLocaleString()));
  wrap.appendChild(stat);

  wrap.appendChild(h("button", { class: "btn", onclick: exportData,
    style: { width: "100%", padding: "14px", background: "var(--teal)", color: "var(--ink)", fontSize: "15px", marginBottom: "10px" } }, "⬇  Export backup (.json)"));

  const importLbl = h("label", { class: "btn", style: { display: "block", width: "100%", padding: "14px", background: "#1c1c1c", color: "#eee", border: "1px solid #333", fontSize: "15px", textAlign: "center", cursor: "pointer", marginBottom: "10px", boxSizing: "border-box" } }, "⬆  Import / restore backup");
  const importInp = h("input", { type: "file", accept: "application/json,.json", style: { display: "none" } });
  importInp.addEventListener("change", importData);
  importLbl.appendChild(importInp);
  wrap.appendChild(importLbl);

  wrap.appendChild(h("button", { class: "btn", onclick: () => {
      if (!confirm("Erase ALL local data? Export a backup first if you might want it back.")) return;
      DB = blankDB(); save(true); toast("All data cleared"); go("week");
    }, style: { width: "100%", padding: "13px", background: "transparent", color: "#a15", border: "1px solid #52222b", fontSize: "14px", marginTop: "4px" } }, "Erase all data"));

  wrap.appendChild(h("p", { style: { fontSize: "12px", color: "var(--dim)", lineHeight: 1.6, marginTop: "18px" } },
    "Tip: use the same browser each time, and add this page to your home screen so your data stays put. Export a backup every few weeks as your safety net."));
}
function exportData() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "golf-fitness-backup-" + dayKey() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast("Backup downloaded ✓");
}
function importData(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || typeof data !== "object" || !("sessions" in data)) throw new Error("bad");
      if (!confirm("Replace current data with this backup? (Export first if unsure.)")) return;
      DB = migrate(data); save(true); toast("Backup restored ✓"); go("week");
    } catch (e) { toast("Couldn't read that file"); }
  };
  reader.readAsText(f);
}

/* ------------------------------ toast ------------------------------------- */
let toastTimer = null;
function toast(msg) {
  let t = document.getElementById("toast");
  if (!t) { t = h("div", { id: "toast", style: { position: "fixed", left: "50%", bottom: "84px", transform: "translateX(-50%)", background: "#2a2a2a", color: "#fff", padding: "10px 18px", borderRadius: "10px", fontSize: "13.5px", fontWeight: 600, zIndex: 60, boxShadow: "0 6px 20px rgba(0,0,0,.5)", opacity: 0, transition: "opacity .18s" } }); document.body.appendChild(t); }
  t.textContent = msg; requestAnimationFrame(() => (t.style.opacity = 1));
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.style.opacity = 0), 1800);
}

/* ------------------------------ boot -------------------------------------- */
window.addEventListener("beforeunload", () => save(true));
document.addEventListener("visibilitychange", () => { if (document.hidden) save(true); });
render();

/* Register the service worker for offline / installable use.
   No-op on file:// (SW needs http/https), so local double-click still works. */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
